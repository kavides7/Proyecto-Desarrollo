<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FARMATODO - Nueva Devolución a Proveedor</title>

  <!-- Estilos compartidos del equipo -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- CDN oficial de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="contenedor">

    <header class="header-principal">
      <div class="header-texto">
        <h1>Droguería FARMATODO</h1>
        <p>Nueva devolución a proveedor (retiro de anaquel)</p>
      </div>
    </header>

    <!-- Notificaciones visuales -->
    <div id="alerta" class="alerta oculto"></div>

    <main class="grid-principal">

      <!-- Columna 1: datos generales de la devolución -->
      <section class="tarjeta">
        <h2 class="titulo-seccion">Datos de la devolución</h2>
        <div class="formulario">

          <div class="campo">
            <label for="select-tienda">Sucursal que retira el producto</label>
            <select id="select-tienda">
              <option value="">Cargando sucursales...</option>
            </select>
          </div>

          <div class="campo">
            <label for="select-proveedor">Proveedor responsable</label>
            <select id="select-proveedor">
              <option value="">Cargando proveedores...</option>
            </select>
            <small id="info-proveedor"></small>
          </div>

          <div class="campo">
            <label for="select-usuario">Registrado por (opcional)</label>
            <select id="select-usuario">
              <option value="">Sin asignar</option>
            </select>
          </div>

          <div class="campo">
            <label for="observaciones">Observaciones (opcional)</label>
            <textarea id="observaciones" rows="3"></textarea>
          </div>

        </div>
      </section>

      <!-- Columna 2: lotes que se devuelven -->
      <section class="tarjeta">
        <h2 class="titulo-seccion">Lotes a devolver</h2>

        <form id="form-linea" class="formulario">

          <div class="campo">
            <label for="select-lote">Medicamento y lote (con stock en la sucursal)</label>
            <select id="select-lote">
              <option value="">Primero elige una sucursal</option>
            </select>
          </div>

          <div class="campo">
            <label for="cantidad">Cantidad a devolver</label>
            <input type="number" id="cantidad" min="1" value="1" />
          </div>

          <div class="campo">
            <label for="motivo">Motivo</label>
            <select id="motivo">
              <option value="Próximo a vencer">Próximo a vencer</option>
              <option value="Vencido">Vencido</option>
              <option value="Dañado">Dañado</option>
              <option value="Otro">Otro</option>
            </select>
          </div>

          <div class="campo">
            <label for="costo">Costo por unidad (Q)</label>
            <input type="number" id="costo" min="0" step="0.01" value="0" />
          </div>

          <button type="submit" class="btn btn-secundario">➕ Agregar lote a la lista</button>
        </form>

        <div class="tabla-contenedor" style="margin-top:1rem;">
          <table class="tabla-datos">
            <thead>
              <tr>
                <th>Producto / Lote</th>
                <th>Vence</th>
                <th class="texto-derecha">Cant.</th>
                <th>Motivo</th>
                <th class="texto-derecha">Costo</th>
                <th>Aviso</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabla-lineas">
              <tr>
                <td colspan="7" class="texto-centro">Todavía no has agregado lotes.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <button type="button" id="btn-registrar" class="btn btn-primario" style="margin-top:1rem;">
          Registrar devolución
        </button>
      </section>

    </main>
  </div>

  <!-- Menú de navegación del módulo -->
  <script src="js/nav-devoluciones.js"></script>

  <!-- Lógica de esta pantalla (NO se carga app.js aquí) -->
  <script src="js/nueva-devolucion.js"></script>
</body>
</html>
