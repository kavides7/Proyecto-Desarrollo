<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FARMATODO - Sistema Central de Inventario</title>
  
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/styles.css" />
  
  <!-- CDN oficial de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="contenedor">
    <!-- Encabezado de la aplicación -->
    <header class="header-principal">
      <div class="header-texto">
        <h1>Droguería FARMATODO</h1>
        <p>Control Central de Existencias y Catálogo Multi-tienda</p>
      </div>
      <div class="badge-region">
        <span>📍 Región Huehuetenango (+15 Sucursales)</span>
      </div>
    </header>

    <!-- Notificaciones visuales -->
    <div id="alerta" class="alerta oculto"></div>

    <!-- Contenido principal en dos columnas -->
    <main class="grid-principal">
      
      <!-- Panel de Registro de Compras/Ventas -->
      <section class="tarjeta">
        <h2 class="titulo-seccion">Registrar Movimiento de Stock</h2>
        <form id="form-movimiento" class="formulario">
          
          <div class="campo">
            <label for="select-tienda">Sucursal / Farmacia</label>
            <select id="select-tienda" required>
              <option value="">Cargando sucursales...</option>
            </select>
          </div>

          <div class="campo">
            <label for="select-lote">Medicamento y Lote</label>
            <select id="select-lote" required>
              <option value="">Cargando medicamentos...</option>
            </select>
          </div>

          <div class="campo">
            <label for="tipo-movimiento">Tipo de Movimiento</label>
            <select id="tipo-movimiento" required>
              <option value="COMPRA">📥 Entrada (Compra / Abastecimiento)</option>
              <option value="VENTA">📤 Salida (Venta de Mostrador)</option>
            </select>
          </div>

          <div class="campo">
            <label for="cantidad">Cantidad de Unidades</label>
            <input type="number" id="cantidad" min="1" value="10" required />
          </div>

          <button type="submit" id="btn-enviar" class="btn btn-primario">
            Procesar Operación
          </button>
        </form>
      </section>

      <!-- Tabla de Stock en Tiempo Real -->
      <section class="tarjeta">
        <div class="tabla-header">
          <h2 class="titulo-seccion">Existencias Actuales en Sucursales</h2>
          <button type="button" id="btn-refrescar" class="btn btn-secundario">
            🔄 Actualizar
          </button>
        </div>

        <div class="tabla-contenedor">
          <table class="tabla-datos">
            <thead>
              <tr>
                <th>Sucursal</th>
                <th>Medicamento</th>
                <th>Lote / Vencimiento</th>
                <th class="texto-derecha">Stock Actual</th>
              </tr>
            </thead>
            <tbody id="tabla-stock">
              <tr>
                <td colspan="4" class="texto-centro">Cargando inventario desde Supabase...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Lógica JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
